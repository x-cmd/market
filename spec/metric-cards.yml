  - id: geo_experiment_design
    label: 地理实验的随机单位与分层分配的效果
    unit: 个
    value:
      nielsen_dmas: 210
      per_arm: 105
      ci_reduction_from_stratification: 10
    as_of: 2011
    geography: 美国
    denominator: null
    numerator: 地理单位数（随机分配的样本量）
    source:
      type: published_finding
      citation: Vaver & Koehler, Measuring Ad Effectiveness Using Geo Experiments, Google
        Inc., 2011
      url: http://audentia-gestion.fr/Recherche-Research-Google/38355.pdf
    caveats:
    - 210 是美国常用的 DMA 数量，不是唯一可选的地理单位
    - 邮编太小，Google 明确说不可行：投放不准，人也会跨边界
    - 分层分配（按规模排序后分组再抽）能把区间收窄约 10%
    - 论文还给了用前测期数据预演区间宽度的办法，不用花钱就能先看设计测不测得出东西
    used_in:
    - 8-analysis-toolbox/02-incrementality-testing

