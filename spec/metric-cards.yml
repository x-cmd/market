    label: 结账实验：观测口径算出的提升 vs 随机实验真值
    unit: '%'
    value:
      exposed_vs_unexposed: 416
      randomized_experiment: 77
    as_of: 2019
    geography: Facebook（15 个实地实验中的一个结账实验）
    denominator: 转化率
    numerator: 有广告与无广告的转化率差
    source:
      type: published_finding
      citation: Gordon, Zettelmeyer, Bhargava & Chapsky, Marketing Science 38(2), 2019
      url: https://pubsonline.informs.org/doi/pdf/10.1287/mksc.2018.1135
    caveats:
    - 观测口径在这次实验里高估了五倍多
    - 论文的结论不是观测方法一律没用，而是恢复不出实验效果；匹配、回归校正、倾向得分都试过
    - 曝光不是随机的，平台会把广告投给本来就更可能买的人，这是高估的根源
    chart:
      page: 8-analysis-toolbox/02-incrementality-testing
      template: echarts
      alt: fb_checkout_416_vs_77
    used_in:
    - 8-analysis-toolbox/02-incrementality-testing
    - 1-report-overview/06-incrementality-chart

