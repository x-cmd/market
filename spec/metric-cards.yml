  - id: paid_search_roi_observed_vs_randomized
    label: 非品牌词搜索广告的回报率，三种算法三个数
    unit: '%'
    value:
      regression_no_controls: 4100
      regression_with_time_and_geo_controls: 1400
      randomized_experiment: -63
    as_of: 2015
    geography: eBay
    denominator: 搜索广告花费
    numerator: 实验或模型归到的增量销售额
    source:
      type: published_finding
      citation: Blake, Nosko & Tadelis, Econometrica 83(1), 2015 — NBER w20171
      url: https://www.nber.org/papers/w20171
    caveats:
    - 回归的 4100% 是「惯例算法」，不是真值
    - 随机实验的 −63% 置信区间是 −124% 到 −3%
    - 这批数据来自 eBay 2015，方法学的结论比数字本身耐用
    chart:
      page: 1-report-overview/06-incrementality-chart
      template: echarts
      alt: ebay_roi_three_ways
    used_in:
    - 1-report-overview/06-incrementality-chart
    - 4-performance-analysis/03-platform-metrics-vs-incremental-metrics

