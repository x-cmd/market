  - id: brand_keyword_click_substitution
    label: 品牌词广告关掉后，被自然搜索接住的那部分点击
    unit: '%'
    value:
      retained_by_natural_search: 99.5
      lost: 0.5
    as_of: 2015
    geography: eBay（Yahoo! 与 MSN 平台上的品牌词投放）
    denominator: 关掉品牌词付费搜索后失去的那部分点击流量
    numerator: 随即被同平台自然搜索接走的点击
    source:
      type: published_finding
      citation: Blake, Nosko & Tadelis, Econometrica 83(1), 2015 — NBER w20171（Table 1，差分中的差分）
      url: https://www.nber.org/papers/w20171
    caveats:
    - 是点击的替代率，不是成交的替代率
    - 论文说这是保留下限：丢掉的那 0.5% 里可能还有人转去了别的入口（比如直接敲 ebay.com）
    - 0.5% 约占全部付费点击的 1.5%
    - 实验停的是 Yahoo! 与 MSN 上的品牌词广告；Google 上的后续实验结论一致
    chart:
      page: 8-analysis-toolbox/01-attribution
      template: echarts
      alt: ebay_brand_keyword_incrementality
    used_in:
    - 8-analysis-toolbox/01-attribution
    - 8-analysis-toolbox/03-mmm-contribution
    - 1-report-overview/06-incrementality-chart

