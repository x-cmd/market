      - 覆盖全部鞋类，不是只跑鞋
      - 季调数，做同比要用原始序列
      - 这里用的是年均值，月度序列在命令输出里
    chart:
      page: 2-market-research/13-running-shoes-competitors
      template: echarts
      alt: shoe_cpi
    used_in:
      - 2-market-research/13-running-shoes-competitors
