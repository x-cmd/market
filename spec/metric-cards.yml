  - id: mmm_baseline_share_range
    label: MMM 拆解里，基线（没广告也会有的销售）占多少，以及基线怎么改贡献
    unit: '%'
    value:
      baseline_in_decomposition: 18
      baseline_scenario_a: 20
      baseline_scenario_b: 40
      search_contribution_at_baseline_a: 38
      search_contribution_at_baseline_b: 29
    as_of: 2026
    geography: 算例（页面用一个四渠道的分解做敏感性示意，不是某一家的实测）
    denominator: 总销售额
    numerator: 不投任何广告时本来会有的销售
    source:
      type: published_finding
      citation: 本页算例：基线从 20% 提到 40%，搜索广告贡献从 38% 掉到 29%
      url: ''
    caveats:
    - 基线是估计出来的，不能直接量，除非真停投一次
    - 基线估高了，各渠道贡献就都缩小；估低了就都虚胖
    - 同一份数据、同一个模型，只换基线设定，一个渠道的贡献就差了三成
    - 这一格决定整份 MMM 报告的可信空间
    used_in:
    - 8-analysis-toolbox/03-mmm-contribution

  - id: mmm_adstock_rate_by_channel
    label: Adstock 衰减率（λ）的行业惯例区间，按渠道
    unit: 比率（每天保留的比例）
    value:
      search:
      - 0.1
      - 0.3
      social:
      - 0.7
      - 0.7
      television:
      - 0.7
      - 0.9
    as_of: 2017
    geography: 通用（营销组合模型里的常见取值）
    denominator: null
    numerator: 当天投放的效果在后续每一天还剩多少
    source:
      type: published_finding
      citation: Jin, Wang, Sun, Chan & Koehler, Bayesian Methods for Media Mix Modeling
        with Carryover and Shape Effects, Google Research, 2017
      url: https://research.google/pubs/
    caveats:
    - 这些是先验知识，不是从数据里估出来的
    - 衰减率由事先设定，模型算出的电视贡献大可能只是因为电视的尾巴长
    - 衰减太快会低估长尾渠道，太慢会高估短尾渠道
    - 单渠道的真实衰减形状未必是指数的
    used_in:
    - 8-analysis-toolbox/04-adstock-decay
    - 8-analysis-toolbox/03-mmm-contribution

  - id: hill_saturation_ceiling_ratio
    label: Hill 饱和曲线：拿到 90% 天花板需要投到饱和点的几倍
    unit: 倍
    value:
      half_ceiling_at: 1.0
      ninety_percent_ceiling_at: 3.0
    as_of: 2026
    geography: 通用（Hill 曲线的数学性质，与渠道无关）
    denominator: null
    numerator: 投入量（以饱和点 k 为单位）
    source:
      type: published_finding
      citation: Hill 函数 效果(x) = x^α / (x^α + k^α) 的代数性质
      url: https://en.wikipedia.org/wiki/Hill_equation
    caveats:
    - 3 倍这个关系对任何 α 都成立，因为 3^α / (3^α + 1) = 0.9
    - k 本身估不准的时候，这个倍数关系救不了你
    - α 大于 1 时曲线在低投入段更平，小额试水的回报被压扁
    used_in:
    - 8-analysis-toolbox/05-hill-saturation-curve

  - id: marginal_roi_floor
    label: 平均 ROI 的下限是 1，边际 ROI 没有下限
    unit: 倍
    value:
      average_roi_floor: 1.0
      marginal_roi_can_be_negative: true
    as_of: 2026
    geography: 通用（算术性质）
    denominator: 总花费（平均 ROI）/ 分档花费（边际 ROI）
    numerator: 总回报 / 该档换回
    source:
      type: published_finding
      citation: 算例：搜索广告五档各 10 万，回报 48/31/20/11/4 万，平均 ROI 2.28，最后一档边际 ROI 0.4
      url: ''
    caveats:
    - 平均 ROI 是累计的，前几档赚的钱会替后面的档次垫着
    - 边际 ROI 可以是 0，也可以是负数
    - 一个渠道平均 ROI 还有 1.9、边际 ROI 掉到 0.2，不是矛盾是两个问题
    - 这个 2.28 是账面回报不是增量回报，真实增量可能低得多
