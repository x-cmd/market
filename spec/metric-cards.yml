    label: 同一个广告活动，观测口径算出的提升 vs 实验真值
    unit: '%'
    value:
      randomized_experiment: 73
      exact_match_age_gender: 222
      exposed_vs_unexposed: 316
    as_of: 2015
    geography: 美国，某全渠道零售商（Facebook 广告）
