      alt: eu_turnover_index
    used_in:
      - 2-market-research/01-industry-entry-scale-growth-concentration

  # ── 网站分析竞品（跑鞋那组之外的一组） ────────────────────────
  - id: gh_stars_umami
    label: GitHub star 数
    unit: "个"
    value: 39983
    as_of: 2026-11-08
    geography: umami-software/umami
    denominator: null
    numerator: null
    source:
      type: api
      provider: GitHub
      dataset: repos
      series: umami-software/umami
      command: curl -s https://api.github.com/repos/umami-software/umami
      published: 2026-11-08
    caveats:
      - 每天在变，是快照不是固定值
      - star 是收藏数，不等于在用的人数
      - 抓取需要 User-Agent，否则 GitHub 会拒
    chart:
      page: 2-market-research/14-analytics-tools-competitors
      template: echarts
      alt: gh_stars
    used_in:
      - 2-market-research/14-analytics-tools-competitors

  - id: gh_forks_umami
    label: GitHub fork 数
    unit: "个"
    value: 8501
    as_of: 2026-11-08
    geography: umami-software/umami
    denominator: null
    numerator: null
    source:
      type: api
      provider: GitHub
      dataset: repos
      series: umami-software/umami
      command: curl -s https://api.github.com/repos/umami-software/umami
      published: 2026-11-08
    caveats:
      - fork 是 clone 出来的仓库数，含自己 fork 完就放着的
      - 对自托管选型比 star 更说明问题：改的人多，踩坑少
    chart:
