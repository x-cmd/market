    caveats:
    - 区间宽度跟样本量的平方根成反比，所以翻倍样本只收窄约三成
    - 区间是对称的，所以它必然包含零的可能：区间跨过零时，那个效应跟零没有区别
    - 区间只覆盖「模型形式是对的」这个前提，不覆盖模型形式本身对不对
    - 看了很多个模型只报最好的那个，区间是假的
