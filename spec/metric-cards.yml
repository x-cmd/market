    label: eBay 品牌词广告：观测口径算出的回报 vs 随机实验真值
    unit: '%'
    value:
      observed_method: '>1400'
      randomized_experiment: -63
    as_of: 2015
    geography: eBay（Yahoo! 与 MSN 平台上的品牌词投放）
    denominator: 品牌词广告花费
