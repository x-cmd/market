  - id: shoe_brand_revenue
    label: 鞋类品牌年营收（SEC XBRL 口径）
    unit: "十亿美元"
    value:
      NIKE: 46.40
      Skechers: 8.97
      Deckers: 5.47
      Wolverine: 1.87
    as_of: 2026-11-08
    geography: 美国上市公司
    denominator: null
    numerator: 企业全部营收（不是鞋类分部）
    source:
      type: dataset
      provider: SEC EDGAR
      dataset: companyconcept
      series: us-gaap/RevenueFromContractWithCustomerExcludingAssessedTax
      command: 'curl -s -H "User-Agent: <you> <mail>" https://data.sec.gov/api/xbrl/companyconcept/CIK0000320187/us-gaap/RevenueFromContractWithCustomerExcludingAssessedTax.json'
      published: 2026-11-08
    caveats:
      - 各家财年结束日不同（NIKE 5 月底、Deckers 3 月底、Skechers 12 月底、Wolverine 1 月初）
      - 横向比之前必须先对齐财年，否则会得出相反的结论
      - 这是公司总营收，不是跑鞋分部营收
      - Adidas、ASICS、New Balance、On 不在 us-gaap 库里，留空
    chart:
      page: 2-market-research/13-running-shoes-competitors
      template: echarts
      alt: shoe_rev
    used_in:
      - 2-market-research/13-running-shoes-competitors

