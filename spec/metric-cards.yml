    label: 美国鞋类 CPI（季调，1982-84=100）
    unit: "指数"
    value:
      "2015": 130.2
      "2020": 133.2
      "2022": 144.5
      "2025": 145.5
    as_of: 2026-11-08
    geography: 美国
    denominator: 1982-84 = 100
    numerator: 鞋类消费价格指数
    source:
