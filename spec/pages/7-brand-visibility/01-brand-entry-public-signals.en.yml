id: 01-brand-entry-public-signals
title: Every brand number comes with a receipt, or it does not count
sections:
  - title: Where a brand's position actually comes from
    content: "A brand's standing breaks into five questions, each with a public number and its own definition, and visibility alone already ranks eight competitors differently from revenue"
  - title: The seven fields a brand entry has to fill
    content: "Company and brand, category, share, price premium, search and volume, public financials, source and date — an empty field must say why"
  - title: Company and brand are not the same thing
    content: "One company can own several brands and one brand can sit inside several companies, and the wrong article name turns measured visibility into zero"
  - title: Three public routes to a share number
    content: "Official statistics, third-party estimates and figures backed out of the filings, and why a derived share has to travel with its arithmetic"
  - title: How to price a premium so it does not mislead
    content: "Three choices decide the answer: who you compare against, list price or transaction price, and what you price off"
  - title: What search and volume can actually show
    content: "Wikipedia article views as the reproducible substitute for brand-term search volume, and the three separate fields it must not be mixed with"
  - title: What the filings give you
    content: "Company revenue, marketing spend and regional splits are available and auditable; single-brand granularity and the latest fiscal year for some companies are not"
  - title: What the catalogue is for
    content: "Each number says what was recorded under one definition, and naming the fields that could not be filled beats a tidy-looking set of numbers"
