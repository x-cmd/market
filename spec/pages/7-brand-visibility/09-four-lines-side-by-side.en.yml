id: 09-four-lines-side-by-side
title: "Four numbers, one brand, and only one of them moved"
sections:
  - title: "Each measure answers a different question"
    content: "Search share counts slots, social mentions count people who already know you, AI mentions count what a model has in mind, and direct traffic counts memory, so merging them into one brand health score hides which line moved"
  - title: "The four lines for On Holding AG"
    content: "Search share, AI mentions, and social mentions for On Holding AG around the 2026-09-18 Mbappé signing, plus why the direct traffic cell is left empty rather than estimated"
  - title: "Three questions to ask when the lines sit side by side"
    content: "Which line moved first, whether the directions agree, and whether one line substituted for another, with the 12-brand peer comparison showing the 8.74x spike was On's own and not the category's"
  - title: "One quarter of the four lines together"
    content: "Monthly pageviews from 2026-07 to 2026-10 showing a one-off pulse rather than a trend, plus the Q2 2026 DTC figures that predate the event"
  - title: "Where a single line misleads"
    content: "What each line read alone would have concluded, and how reading all four together identifies social mentions as the only line that moved"
