id: 06-brand-terms-vs-category-terms
title: "A brand term and a category term answer two different questions"
sections:
  - title: "One term rose 349% while the other two fell"
    content: "Lululemon's brand term jumped 349% quarter over quarter while Yoga pants fell 35% and Athletic shoe fell 2%, and plotting both kinds on one axis is what makes the split legible"
  - title: "Brand terms measure health, category terms measure opportunity"
    content: "A brand term names you and comes from buyers ready to purchase, a category term names the product and comes from people still learning the market, and competitors can take category volume away from you but never brand volume"
  - title: "A brand term can quadruple while the business shrinks"
    content: "The March 2025 SXSW pop-up lifted the brand term fourfold inside eight weeks while operating income fell 22% and the CEO departed, so attention and business came apart"
  - title: "Report the two kinds of terms separately"
    content: "Never add the two into a total search volume, always label which kind each number is, and tie every brand-term rise to a business line before it counts as good news"
