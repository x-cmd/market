id: 08-the-five-column-table
title: "Five columns decide what a table is allowed to say"
sections:
  - title: "Check the headers before you read the numbers"
    content: "The table needs term, channel, date, count, and sentiment; missing one changes the answer, and the On-on-Nike cell (168 naive hits, 0 real brand mentions) shows why the headers come first"
  - title: "Each column has to carry one fact"
    content: "Term, channel, date, count, and sentiment each have to hold a specific fact, and each one fails in a characteristic way"
    subsections:
      - title: "Term: a string is not a thing being referred to"
        content: "On the word boundary is the preposition; requiring On/ON plus Cloud, Running, Shoes, Sneakers, Trainers, Holding, or on.com drops Nike's count from 168 to 0"
      - title: "Channel: the same word lands on a different number"
        content: "Brand-owned apps (On 158, Nike 125, adidas 59, Under Armour 40) measure the word on, not the brand; brand-owned numbers run optimistic, retail numbers carry the outside view"
      - title: "Count: occurrences, mentions, and review rows differ"
        content: "47 occurrences across 38 reviews with 7 reviews repeating: 9.7% versus 7.9%, both called mention rate and 1.9 points apart"
      - title: "Sentiment: who did the labelling"
        content: "User-tapped stars are the most trustworthy label, but the label has to sit on the right term: the negative rate goes from 72% to 10.5% and reverses direction when the matching rule tightens"
      - title: "Date: the day you looked, or the window you measured"
        content: "All seven apps say most recent 500 but the spans differ 12 times, from 114 days to 1,415; a fixed 90-day window leaves Zappos with 10 reviews, so its 0 is coverage, not silence"
  - title: "A zero is not the same as nothing there"
    content: "A 0 can mean no data in the window, a source that does not support the granularity, or a genuine absence, so empty cells are written in three tiers with NA kept separate from 0"
  - title: "One missing column makes the table unusable"
    content: "Attaching a 72% negative rate to a brand nobody mentioned reverses the conclusion, every cell carries uncertainty, and the habit to build is count the columns first and say why a cell is empty"
