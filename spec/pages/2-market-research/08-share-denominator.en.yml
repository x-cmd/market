id: 08-share-denominator
title: One percentage, four different numbers
sections:
  - title: A share is three decisions, not one
    content: "Online is 23% of our sales can mean four different numbers, and each one is decided by the denominator, the numerator and the population covered"
  - title: Change the numerator and the number doubles
    content: "Same denominator, same year, same enterprises: 19.82% for all web sales against 8.49% for the part sold to consumers"
  - title: Hungary is the row worth stopping on
    content: "30.85% of Hungarian enterprise turnover comes from web sales, but only 0.92% of it reaches consumers, so the rest is wholesale"
  - title: The same "e-commerce" can be two different businesses
    content: "Cyprus sells 91% of its web sales to consumers and Hungary 3%, so one is retail e-commerce and the other wholesale"
  - title: The same metric can jump for different reasons
    content: "Germany falls from 27.69% to 15.96% in a year, which is a change in definition rather than in business"
  - title: Three questions that make a share defensible
    content: "Whose denominator, what is in the numerator, and am I inside the same box, run against the EU figure"
  - title: What you report is "23% inside a box"
    content: "A correct number can still be uncomparable, and the box it sits in is yours to name"
