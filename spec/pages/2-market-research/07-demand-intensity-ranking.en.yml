id: 07-demand-intensity-ranking
title: "Five selling points, one priority: the yardstick decides the winner"
sections:
  - title: Five that all claim first place is zero that made first
    content: "When every selling point claims to be important, none of them is, so a first has to be named: not the best one, but the one built first"
  - title: Averaging the scores destroys the information you need
    content: "Importance is an order, not a quantity, and an average of headcount with equal weights erases the dissenting segment"
  - title: Three measures of demand that actually work
    content: "MaxDiff priority ranking, intensity distribution read as a shape, and willingness to pay converted into money"
  - title: Many buyers and intense buyers are two different things
    content: "Breadth and intensity are independent numbers, and Greece, the Czech Republic, Hungary and Poland each sit in a different place on the two axes"
  - title: The top spot picked by average score ends up reversed
    content: "Averaging rewards whatever everybody finds acceptable, so the validated first place is often not the average's first place"
  - title: Say out loud which ruler you ranked by
    content: "A ranking handed over has to carry three sentences: which ruler you used, where each number came from, and what would change the first place"
