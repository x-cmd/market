id: 11-coverage-gaps
title: Before you quote a number, find out who it leaves out
sections:
  - title: The firms this number never reaches
    content: "The GE10 size class covers 5.17% of EU retail firms but 77.18% of turnover, so the 94.8% outside the frame is a different business"
  - title: It describes the counted, not everyone
    content: "The denominator is what gets misread: four frame restrictions, a parallel B2C-only numerator of 8.49%, and a frame that changes between 2024 and 2025"
  - title: The four gaps that get missed most
    content: "Size, sector, geography and channel each move the same penetration number, from 9.66% in France to 90.45% in accommodation and food"
  - title: Which way a gap bends the number
    content: "Share figures come out too big and growth rates too small, while the excluded 605,562 million euros of turnover is understated"
  - title: How to mark what you left out
    content: "Write the coverage into the title and note, and break the line where a real judgement sits between two data points"
  - title: Whitespace is information, not a defect
    content: "What a chart leaves out is worth more than what it draws, so publish the number inside its frame rather than the number alone"
