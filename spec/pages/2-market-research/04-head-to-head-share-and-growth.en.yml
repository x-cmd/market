id: 04-head-to-head-share-and-growth
title: "Two companies cannot be compared until their numbers mean the same thing"
sections:
  - title: Every company leads by the measure it picked
    content: "Each company holds a filing that flatters it, and the size column alone has more than one conversion, so \"which one is bigger\" has no single answer"
  - title: Mismatched definitions make two numbers incomparable
    content: "Amazon has no revenue line called e-commerce, so one company and one year produce three different \"online\" figures that differ by more than a factor of two"
  - title: Growth only counts when both sides cover the same months
    content: "The two fiscal years overlap for only 11 of 12 months, and the base year decides the answer, so the same data gives 17.8% against 4.9% or 24.4% against 9.0%"
  - title: One company leads on share, the other on growth
    content: "Walmart has the faster growth and Amazon the bigger online business, and the two questions answer where a company stands today versus where it is heading"
  - title: Align first, then compare, and call the leftovers what they are
    content: "The final table, where two cells stay empty because Walmart and Amazon do not disclose them, and an estimate left in a competitor table becomes fact"
