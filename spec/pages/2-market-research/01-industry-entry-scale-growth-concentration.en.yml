id: 01-industry-entry-scale-growth-concentration
title: "Three numbers decide whether an industry is worth entering"
sections:
  - title: The eight cells a usable industry entry fills
    content: "Size, growth and concentration come in a fixed order, and the entry itself needs eight cells: definition and boundary, size, growth, concentration, price bands, seasonality, and sources"
  - title: "\"How big is the industry\" has three answers"
    content: "Turnover, combined wholesale and retail turnover, and value added all size EU retail correctly, and the three differ by a factor of 19"
  - title: Growth in euros or growth in goods
    content: "EU retail grew 19.5% nominally from 2021 to 2025 and 1.6% in real terms; the same gap is far wider country by country"
  - title: How much of the industry the giants decide
    content: "94.9% of EU retail enterprises take 21.5% of turnover while 0.11% take 50.7%, and the CR4 and HHI cells stay empty for lack of company-level data"
  - title: What the three numbers say about the business
    content: "Three combinations of size, growth and concentration, and why the direction of change matters more than the level"
  - title: Every number needs to name who measured it
    content: "The four-grid entry: size, growth, concentration and definitions, where the fourth grid decides whether the first three can be used"
  - title: The seasonality cell is the easiest one to get wrong
    content: "December 2024 reads 138.8 on the calendar-adjusted index and 119.6 on the seasonally adjusted one, and the 19-point gap is Christmas"
  - title: The number you publish carries its own definitions
    content: "The value of an industry entry is the sentence behind the number, not the number itself"
