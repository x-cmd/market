id: 04-confidence-intervals
title: "Reporting 4.0 without a range is reporting half the result"
sections:
  - title: A point estimate says what you found, not what is true
    content: "The same eBay brand-keyword ads gave ROI of 4100%, 1400%, and −63% depending on how they were measured, and the randomized interval [−124%, −3%] says the ads lost money, not that the loss was mild"
  - title: Two point estimates rarely settle an argument an interval would
    content: "The gap between two point estimates is usually smaller than either interval's width, so the interval reframes the question, and the interval itself only covers the assumption that the model form is right, never that the model form is right"
  - title: A 95% interval describes your method, not your confidence
    content: "The true value falls inside a 95% interval 95% of the time across repeated runs, so it is not a 95% guarantee for any single run, and an interval crossing zero only means the effect is undetectable"
  - title: Sample size buys you less than you think
    content: "Sample size, variability, and effect size decide the width — 40 times the sample buys a sixth of the width, and halving the effect size requires four times the sample"
  - title: Overlapping intervals still leave a comparison worth making
    content: "Compare the difference rather than the two point estimates: a 0.6 ROI gap with a difference interval of [−2.5, 3.7] is worth resolving only when the business volume makes it worth 600,000 a month"
  - title: One interval turned a 2,000,000 bet into a small step
    content: "A consumer brand's search-ads test showed a point estimate of 4.0 and an interval of [1.2, 6.8], and that interval killed a planned 2,000,000 increase in spend"
  - title: Report the number, the width, and where both came from
    content: "Say the point estimate, the interval width, and the sample size and setup the interval came from, and report the interval even when it is the number that argues against your own plan"
