id: 01-equal-marginal-returns
title: "A budget split is only optimal when every channel's last dollar earns the same"
sections:
  - title: "The next dollar goes wherever it earns the most"
    content: "Marginal return is what one more dollar earns, not what an average dollar earns; each channel's curve, not its average, is the input to the allocation"
  - title: "Stop when every channel's last dollar earns the same"
    content: "With a fixed total, total return is maximized when every channel's marginal return is equal, and that shared number is the shadow price"
  - title: "A worked example: 1,000,000 across three channels"
    content: "The equalized split is search 300,000, social 400,000, content 300,000 at a marginal of 2.0 and total return 2.52, more than double the 1.17 from putting everything into search"
  - title: "Four conditions, and breaking any one of them breaks the rule"
    content: "The principle needs estimable marginals, a fixed total, no hard channel limits, and no cross-effects between channels"
  - title: "The equalized point tells you how much your estimates can be wrong"
    content: "The equalized point is a set of numbers rather than one figure, is unique for monotonic curves, and is less sensitive to estimation error where the curves are flat"
  - title: "Equalizing stops waste, but the level still has to clear 1"
    content: "Equalizing guarantees you do not waste, not that you earn; the shared marginal must also be above 1, and equalizing does not mean spending the same amount in every channel"
