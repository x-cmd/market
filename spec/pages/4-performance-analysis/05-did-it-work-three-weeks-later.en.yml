id: 05-did-it-work-three-weeks-later
title: Three weeks in, a 1% lift is not a verdict
sections:
  - title: The dashboard shows a running total, not a campaign result
    content: "The report says everything that has happened so far rather than what the campaign produced, and 4% of natural swing in one category makes a real 3% lift impossible to see"
  - title: Three reasons the effect arrives late
    content: "The ad's own Adstock decay and its lambda parameter, the buyer's decision cycle that varies by category, and B2B budget approval — three reasons one window cannot fit every channel and every category"
  - title: A short window turns seasonality into your result
    content: "The 17.8% gap between February and December in EU retail turnover, how a promotion moves demand forward in time, and why a short window makes waiting and stopping look identical"
  - title: How to find out whether the campaign worked
    content: "A contemporaneous control that waits as long as the campaign does, the time series instead of a single point, ruling out what else ran at the same time, and how the sample size a window buys caps your precision"
  - title: A promotion that only shows up in week three
    content: "A worked example where the season and the campaign land in the same cell of the dashboard, and the same 260,000 of spend returns 0.8 in week three, 1.42 in week eight, and 1.6 by week twelve"
  - title: Fix the window before you start, not after
    content: "The three things that set the window length, writing it into the brief before the spend, and why an effect that never arrives is also an answer rather than a reason to wait forever"
