id: 04-marginal-roi-decay
title: Your average ROI says nothing about whether the next dollar pays
sections:
  - title: A good average does not mean you can spend more
    content: "Cumulative average ROI slides from 6.6 to 3.11 while marginal ROI falls from 6.6 to 0.4, and the average can never drop below 1 while the marginal number can"
  - title: What one more dollar actually brings back
    content: "Marginal ROI is one band's return over that band's spend, and it is not the same as incremental return once substitution is taken out"
  - title: How to cut the curve
    content: "Split the spend into equal-width bands, align time so ad effects land in the right band, then take the difference band by band"
  - title: Where the next dollar stops paying
    content: "The turning point is where the marginal curve crosses 1.0, and a Hill curve puts it at a specific spend level"
  - title: When the average misleads
    content: "The total can grow while efficiency falls, organic search can be booked to paid search, and new customers can flatter an average that later collapses"
  - title: Decide on the last dollar, not the total
    content: "Draw the curve for the channel that matters, read off the turning point, and stop the budget there"
