id: 04-price-band-chart
title: Your price only holds up if the category agrees
sections:
  - title: Find your band before you read anything else
    content: Bands are ordered by price with each one's volume share, so you can locate your own position in the category
  - title: Draw the category boundary before you draw the bands
    content: Frame the category by product or by channel type, and decide whether service and installation are included
  - title: Cut the bands by volume, not by instinct
    content: Find the prices where cumulative volume hits 25%, 50%, and 75% instead of hand-picking tiers
  - title: What a real category's bands look like
    content: Run the method on US furniture and home furnishings stores, and see volume share diverge from revenue share
  - title: Promotion runs deepest in the middle, and never at the top
    content: Why the middle bands clear inventory with discounts while the top band protects its positioning
  - title: How hard you discount has to be predictable
    content: How many sale events per year, how deep, which kind of promotion, and how far peak sits from trough
  - title: Four boxes decide whether your position holds
    content: Boundaries, bands, promotion rhythm, and seasonality all have to be filled in
