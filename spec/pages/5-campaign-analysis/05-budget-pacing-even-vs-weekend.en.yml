id: 05-budget-pacing-even-vs-weekend
title: "Spread the same budget over the calendar and you buy 14,286 more impressions"
sections:
  - title: The auction prices the moment, not your monthly average
    content: "A bidding system prices supply and demand right now, and the UK's internet sales share runs from 25.9% in February to 32.4% in November and back to 29.6% in December, a shape that repeats every year"
  - title: Three shapes, and the one that gets missed
    content: "Even spending gives stable volume and clean learning data, concentration buys peak traffic at the most crowded prices, and the option that gets missed is following the real shape of demand, which Etsy's buyer frequency data shows is highly concentrated"
  - title: Three things sit between the same money and a different result
    content: "The auction environment, the scattered rhythm of when buyers actually purchase, and the inventory and support capacity behind a volume spike all change the result, and none of them appear in the bid column"
  - title: The same 14,000 yuan over two weeks, two ways
    content: "Even spending buys 223,810 impressions at a blended CPM of 62.55 yuan against 209,524 at 66.82 yuan for the weekend-heavy plan, so the same money buys 14,286 more impressions spread out"
  - title: Etsy made money from the shape of its spend
    content: "Etsy credits more efficient seller budget pacing for part of its 62.2 million dollar ad revenue gain, and the company reported 64.4 million dollars more ad revenue in the first three quarters of 2026, with click volume ahead of price per click"
  - title: Put pacing on the same shelf as bid and targeting
    content: "Marin Software ships budget pacing as a named product, so measure demand first, mark the holidays on your daily conversion curve, and test the time distribution on its own every two weeks"
