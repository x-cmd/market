id: 05-budget-pacing-even-vs-weekend
title: "The same budget buys 14,286 more impressions when you spread it out"
sections:
  - title: Why the shape of the spend changes the outcome
    content: "A bidding system prices supply and demand right now rather than your monthly average, and the UK internet sales share shows demand itself runs from 26.1% in August to 32.4% in November and back down to 29.6% in December, a shape that repeats every year"
  - title: Three shapes you can pick from
    content: "Even spending gives stable volume and clean learning data, concentration buys peak traffic at the most crowded prices, and the option that gets missed is following the real shape of demand, which Etsy's buyer frequency data shows is highly concentrated"
  - title: Three layers turn pacing into a different outcome
    content: "The auction environment, the scattered rhythm of when buyers actually purchase, and the inventory and support capacity behind a volume spike all change the result, and none of them appear in the bid column"
  - title: The same 14,000 yuan over two weeks, two ways
    content: "Even spending buys 223,810 impressions at a blended CPM of 62.55 yuan against 209,524 at 66.82 yuan for the weekend-heavy plan, so the same money buys 14,286 more impressions spread out"
  - title: Pacing is a variable, not an execution detail
    content: "Etsy credits more efficient seller budget pacing for part of its 62.2 million dollar ad revenue gain, and Marin Software ships budget pacing as a named product, so measure demand first, mark the holidays, and test pacing as a variable of its own"
