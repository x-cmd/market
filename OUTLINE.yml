      content: 品牌词问的是你，品类词问的是这件事
    - title: 知道各自说明什么
      content: 品牌词看品牌健康，品类词看市场机会
    - title: 一个品牌词在涨、品类词在跌的季度
      content: 一个品牌词在涨、品类词在跌的季度
    - title: 两类词要分开看，分开报
      content: 两类词要分开看，分开报
  - id: 06-keyword-list-triage
    title: 词表排对，后面的数才对
    sections:
    - title: 知道词表为什么越加越长越没用
      content: 词表越加越长
    - title: 知道排词表只看三件事
      content: 类型（品牌词/品类词/竞品词）、优先级、时效
    - title: 三百个词，最后剩十二个
      content: 一张从三百个词开始、最后剩十二个的词表
    - title: 排词表的时间比加词的时间长
      content: 排词表的时间比加词的时间长
  - id: 07-the-five-column-table
    title: 交过来的表，要看哪几列
    sections:
    - title: 知道拿到表先看有没有缺列
      content: 表到了，看不懂
    - title: 知道五列各是什么
      content: 词、渠道、日期、次数、情绪
      subsections:
      - title: 次数
        content: 是出现次数还是提及次数
      - title: 情绪
        content: 谁打的标，打的什么标
      - title: 日期
        content: 是观测日还是统计窗
    - title: 知道没查到不等于零
      content: 没查到不等于零：空值、NA 与不写这一行是三件事
    - title: 缺一列这张表就不能用
      content: 缺一列这张表就不能用，先补齐再分析
  - id: 08-four-lines-side-by-side
    title: 把四个数放一起看，才知道哪个在动
    sections:
    - title: 知道四个指标为什么会各说各话
      content: 四个指标各说各话
    - title: 知道看哪四条线
      content: 搜索份额、社媒提及、AI 提及、直接流量
    - title: 知道并排看要问哪三个问题
      content: 谁先动、动的方向一不一样、有没有互相替代
    - title: 四条线并排的一个季度
      content: 四条线并排的一个季度
    - title: 单看一条线最容易看错
      content: 单看一条线最容易看错，四个放一起才知道哪个在动
- id: 9-glossary
  title: 名词解释
  articles:
  - id: 00-toolbox-overview
    title: 八个工具，一张表
    sections:
    - title: 知道八个工具各管什么
      content: 工具、干什么、输入、输出、在哪篇用过
    - title: 知道每个工具管哪一步
      content: 哪一步解决哪个问题
    - title: 知道哪几篇讲过
      content: 每篇列出用了哪几个
  - id: 01-attribution
    title: 归因：把功劳分给各个接触点
    sections:
    - title: 知道归因在做什么
      content: 把转化按接触点分摊
    - title: 知道常见几种分法
      content: 末次点击、首次点击、线性、时间衰减、位置
    - title: 知道它什么时候不靠谱
      content: 自然需求被认领；曝光不可见
    - title: 知道站内哪几篇讲过
      content: 1-overview/01、4-analytics/03
  - id: 02-incrementality-testing
    title: 增量实验：拿一块地方做对照
    sections:
    - title: 知道增量实验在做什么
      content: 停投后少掉的单就是增量
    - title: 知道三种做法
      content: 地理切分、时间切分、幽灵广告
    - title: 知道它什么时候不靠谱
      content: 两块地方本来就不一样；样本太小
    - title: 知道站内哪几篇讲过
      content: 1-overview/01、1-overview/05、3-experiment/01
  - id: 03-mmm-contribution
    title: MMM 贡献分解：把长期贡献拆开
    sections:
    - title: 知道 MMM 贡献分解在做什么
      content: 在多个渠道的回归里拆出各自贡献
    - title: 知道贡献是怎么拆的
      content: 跟基线、广告饱和、时滞一起看
    - title: 知道它什么时候不靠谱
      content: 变量之间高度相关时贡献分不开
    - title: 知道站内哪几篇讲过
      content: 4-analytics/04
  - id: 04-adstock-decay
    title: Adstock 衰减：广告的效果会拖多久
    sections:
    - title: 知道 Adstock 在做什么
      content: 把过去的投放效果按衰减曲线累积到今天
    - title: 知道衰减的几何形状
      content: 效果逐日打折，打折快慢由参数定
    - title: 知道它什么时候不靠谱
      content: 衰减太快会低估长尾渠道
    - title: 知道站内哪几篇讲过
      content: 4-analytics/05、3-mmm-contribution
  - id: 05-hill-saturation-curve
    title: Hill 饱和曲线：效果怎么撞天花板
    sections:
    - title: 知道饱和曲线在做什么
      content: 效果随投入增加但增速递减
    - title: 知道两个参数各管什么
      content: 饱和点定天花板在哪，弹性定靠近天花板的速度
    - title: 知道它什么时候不靠谱
      content: 刚起步的渠道用历史数据估不出饱和点
    - title: 知道站内哪几篇讲过
      content: 1-overview/03、4-analytics/04
  - id: 06-marginal-vs-average-roi
    title: 边际 ROI 和平均 ROI：两个不同的数
    sections:
    - title: 知道这两个数分别是什么
      content: 平均是总回报除以总花费，边际是最后一块钱带来的
    - title: 知道怎么算
      content: 举一个具体数字算两遍
    - title: 知道它什么时候不靠谱
      content: 花费没分档时算不出边际
    - title: 知道站内哪几篇讲过
      content: 4-analytics/04、6-optimization/01
  - id: 07-equal-marginal-returns-principle
    title: 等边际原则：最优分配的判据
    sections:
    - title: 知道这个原则说了什么
      content: 固定总量下，各渠道边际相等时总和最大
    - title: 知道它怎么推出来的
      content: 一两句不等式直觉
    - title: 知道它什么时候不靠谱
      content: 边际不可估、有硬约束、总量不固定时
    - title: 知道站内哪几篇讲过
      content: 6-optimization/01、6-optimization/03
  - id: 08-confidence-intervals-and-fit
    title: 置信区间和拟合度：模型能信几分
    sections:
    - title: 知道这两把尺子各量什么
      content: 区间说参数的不确定性，拟合度说模型整体的解释力
    - title: 知道为什么不能互相替代
      content: 量的是不同的东西，不能互相替代
    - title: 知道它什么时候不靠谱
      content: 拟合度高不等于因果成立；外推会崩
    - title: 知道站内哪几篇讲过
      content: 3-experiment/02、3-experiment/04
