id: x-market-1-overview-00-site-outline

data:
  - name:
      en: what this site is
      cn: 这个站是什么
    qa:
      - id: what-is-this-site
        question:
          en: What is this site, in one sentence?
          cn: 这个站是什么，一句话说清。
        answer:
          en: >
            A manual for writing a market and marketing report. It goes section by section through the ten parts such a report has, and for each one it says which fields to fill, where the numbers come from, and how to know they are right. It is not a course and not an industry report.
          cn: >
            一份市场与营销报告的写作手册。它按这类报告的十节一节一节地讲：每节要填哪些格子，格子里的数从哪来，怎么才算准。它不是教程，也不是行业报告。
        confidence: 10
        reference:
          - docs/1-overview/00-site-outline/cn.md

      - id: how-do-i-start
        question:
          en: I only want a few pages. Where do I start?
          cn: 我只想看几页，从哪儿进？
        answer:
          en: >
            Start from the symptom table at the top of this page, not from the table of contents. Every entry there is written the way you would say it out loud — "the number the platform gave me does not match the one I calculated" — and points to the first page that answers it. Each page also names who it is for, so you can skip everything aimed at someone else.
          cn: >
            从这页顶上的「你今天卡在哪」那张表进，别从目录进。那张表里每一条都是你嘴上会说的话——「平台给我的数和我自己算的对不上」——后面跟着第一篇能答上它的页面。每页也都写了「适合谁读」，不是写给你看的那几篇你可以直接跳过。
        confidence: 9
        reference:
          - docs/1-overview/00-site-outline/cn.md

      - id: can-i-contribute
        question:
          en: How do I contribute a number or fix a page?
          cn: 我怎么补一个数、或者改一页？
        answer:
          en: >
            Three ways, and all three are small. Fill in a missing field on an entry page and send a pull request — every page that links to that entry benefits at the same time. Redraw a chart with your own numbers, since every chart URL carries its data and can be edited. Or add one public series to the data source list, which gives the whole site one more number it can look up.
          cn: >
            三种，都不费事。条目页上缺哪一格，就填上去发个 PR，站内引用这一条的页面跟着一起受益。图里的数装在 URL 里，你用自己的数重画一遍发过来也行。再或者往数据源台账里加一条公开序列，全站就多一个能查的数。
        confidence: 9
        reference:
          - docs/1-overview/00-site-outline/cn.md

      - id: what-does-the-data-mean
        question:
          en: Does every number on this site come with a way to check it?
          cn: 站上每个数都能查得到出处吗？
        answer:
          en: >
            Every page ends with a data line and a reproduce line. Where the number comes from a public series, the reproduce line is a command that fetches it. Where it comes from a published experiment, the data line names the paper and the journal. Where a chart is drawn from parameters rather than measured data, it is marked illustrative and is only used in the dictionary pages.
          cn: >
            每页最后都有一行数据、一行复现。数来自公开序列的，复现那行就是取它的那条命令；数来自公开发表的实验的，数据那行写清是哪篇论文、哪个期刊。图是拿参数画出来而不是量出来的，会标 illustrative，而且只用字典页。
        confidence: 9
        reference:
          - docs/1-overview/00-site-outline/cn.md
