id: x-market-3-experiment-design-02-sample-size-and-power

data:
  - name:
      en: why small samples flip the answer
      cn: 小样本为什么能把方向搞反
    qa:
      - id: how-small-can-you-go
        question:
          en: "How small can the sample get before the result stops meaning anything?"
          cn: 样本小到什么程度，结果就没意义了？
        answer:
          en:
            >
              There is no single threshold, because the threshold depends on the effect you are
              trying to detect and on the baseline rate. The rule of thumb is that the 95%
              confidence interval must not straddle zero. For the same effect, the half-width of
              the interval is 56 percentage points at 50 users per arm, 29 at 200, and 9 at 2,000.
              So if the effect you expect is 5 points, 50 users per arm gives you an interval
              that spans roughly plus or minus 56 points — you cannot distinguish a good result
              from a bad one. The sample size needed for a given detectable effect is quadratic
              in the effect size: halving the effect you want to detect quadruples the sample
              you need.
          cn:
            >
              没有一个统一的门槛，因为门槛取决于你想测出的效果有多大，以及基线转化率是多少。
              判据是 95% 置信区间不能跨过零。同一个效应量下，区间半宽在每组 50 人时是 56 个百分点，
              每组 200 人时是 29 个百分点，每组 2000 人时是 9 个百分点。所以如果你期待的效果是 5 个点，
              每组 50 人给出的区间大约是上下 56 个点——你分不清这个结果是好是坏。
              另外，所需样本量跟效应量的大小是平方关系：你想测出的效果减半，
              需要的样本要翻两番。
        confidence: 9
        reference:
          - docs/3-experiment-design/02-sample-size-and-power/cn.md
      - id: negative-result-not-no-effect
        question:
          en: "The experiment came back negative. Does that mean the change did not work?"
          cn: 实验测出来是负的，是不是就说明这个改动没用？
        answer:
          en:
            >
              Not necessarily — and this is where small samples do their damage. With 200 users
              per arm, the confidence interval for a small effect is roughly 29 percentage points
              wide on each side. If the truth is a 2-point improvement, the point estimate comes
              out negative about 45% of the time, purely by chance. A negative result from
              a small experiment is not evidence of absence; it is evidence that the experiment
              could not resolve the effect. Before acting on a negative number, check the width of
              the interval. If it spans zero and also spans a value large enough to matter in
              business terms, the correct conclusion is "we could not tell", not "it does not work".
          cn:
            >
              不一定，小样本正是伤害发生的地方。每组 200 人的时候，小效应的 95% 置信区间
              每侧大约有 29 个百分点宽。如果真值是 2 个百分点的提升，
              纯靠运气测出负数的概率大约是 45%。小实验测出负数，不是「没有效果」的证据，
              而是「这个实验分辨不出这个效果」的证据。对着负数做决定之前，先看区间有多宽：
              如果它既跨过零、又把业务上够大的正效果也包了进去，
              正确的结论是「测不出来」，不是「没用」。
        confidence: 9
        reference:
          - docs/3-experiment-design/02-sample-size-and-power/cn.md
      - id: how-many-users
        question:
          en: "How many users do I need to detect a 5% improvement?"
          cn: 要测出 5 个百分点的提升，每组要多少人？
        answer:
          en:
            >
              With the standard settings (two-sided alpha of 0.05, 80% power) and a baseline
              conversion rate around 2%, roughly 270 users per arm. Halving the effect you
              want to detect quadruples the sample: a 2-point effect needs about 1,140 per arm,
              and a 1-point effect needs about 3,830 per arm. The important part is that this
              number has to be fixed before the experiment runs, because after the data is in you
              have no way to know whether the effect was small or your sample was too thin.
          cn:
            >
              按常规设定（双侧 α=0.05、检验力 80%）、基线转化率在 2% 左右，每组大约需要 270 人。
              你想测的效果减半，样本要翻两番：2 个百分点的效果每组约需 1,140 人，
              1 个百分点的效果每组约需 3,830 人。关键在于这个数必须在开跑之前定下来——
              数据出来之后，你没有别的办法判断到底是效果小，还是样本太薄。
        confidence: 8
        reference:
          - docs/3-experiment-design/02-sample-size-and-power/cn.md
      - id: more-samples-diminishing
        question:
          en: "Why does quadrupling the sample only shrink the error bar by half?"
          cn: 样本翻两番，误差怎么只收窄一半？
        answer:
          en:
            >
              Because the standard error falls with the square root of the sample size, not with
              the sample size itself. Going from 200 to 2,000 users per arm is a tenfold increase
              and shrinks the confidence interval from 29 percentage points to 9 — a factor of
              about three, which is the square root of ten. This is why you cannot buy precision
              cheaply: quadrupling the sample buys you half the interval width, and if that is
              still not enough to resolve the effect, the honest answer is that the experiment is
              not worth running rather than that you need to buy eight times the traffic.
          cn:
            >
              因为标准误跟样本量的平方根成反比，不是跟样本量成反比。每组从 200 人加到 2,000 人
              是十倍，置信区间从 29 个百分点收到 9 个点位，收到三分之一左右——正是十倍的平方根。
              这就是精度买不便宜：样本翻两番只换来一半的区间宽度，如果这还不够分辨效果，
              诚实的说法是这个实验不值得做，而不是说你得买八倍的流量。
        confidence: 10
        reference:
          - docs/3-experiment-design/02-sample-size-and-power/cn.md
  - name:
      en: sizing before versus after
      cn: 事前算还是事后算
    qa:
      - id: why-not-after
        question:
          en: "Why can I not just look at the result and decide it was good enough?"
          cn: 为什么不能等数据跑完再看结果好不好？
        answer:
          en:
            >
              Because after the data is in, the only number you have is the estimate — and the
              truth is not observable. You cannot compare the estimate against the thing it is
              supposed to estimate, because that is exactly what you do not know. All you can do
              is compare it against other experiments, whose baseline rates and effect sizes
              differ from yours, and the comparison produces no usable conclusion. Sizing before
              the run forces you to commit to two things you cannot avoid committing to anyway:
              the smallest effect big enough to be worth acting on, and how long the experiment
              will take. Both are known before you spend the traffic.
          cn:
            >
              因为数据出来之后你手里只有一个估计值，而真值是看不到的。你没法拿估计值去跟它本来要估计的东西比，
              那正是你不知道的东西。你能拿来比的只有别的实验，而别的实验的基线转化率和效应量
              都跟你不一样，比出来的结论是空的。事前算样本量，强迫你把两件本来就躲不掉的事写下来：
              最小得多大才值得你动预算，以及这个实验要跑多久。这两样在花钱之前就都知道。
        confidence: 9
        reference:
          - docs/3-experiment-design/02-sample-size-and-power/cn.md
      - id: dry-run-with-pre-period
        question:
          en: "Can I find out whether the design works without spending any money?"
          cn: 有没有办法不花钱就知道这个设计测不测得出东西？
        answer:
          en:
            >
              Yes — use the pre-test period data to simulate the design. Google describes
              exactly this in the 2011 geo experiments paper: run the planned design against
              pre-test data and look at how wide the interval would come out, before spending
              anything. You can also make the design itself cheaper to interpret. Sorting the
              regions by their pre-test response, cutting the ranked list into equal-sized
              groups, and randomly picking one region from each group for treatment — that
              stratified assignment — shrinks the confidence interval by more than 10%.
          cn:
            >
              可以：用前测期数据把设计预演一遍。Google 在 2011 年那篇地域实验论文里写的就是这个办法——
              拿前测期数据按计划好的设计跑一遍，看区间会出来多宽，一分钱没花就能知道测不测得出来。
              还可以让设计本身更好读一点：按前测期响应把所有地区排好序，切成大小相同的一组一组，
              每组随机挑一个进实验组——这种分层分配能把置信区间收窄 10% 以上。
        confidence: 9
        reference:
          - docs/3-experiment-design/02-sample-size-and-power/cn.md
      - id: sample-size-as-go-no-go
        question:
          en: "What if the sample size I need is absurdly large?"
          cn: 算出来需要的样本量大得离谱，怎么办？
        answer:
          en:
            >
              Then you do not run the experiment, and that is a result, not a failure. A
              1-percentage-point effect needs nearly 3,830 users per arm; if that translates to
              two months of traffic, the experiment cannot change any decision you would make
              differently anyway. Three legitimate ways out: raise the allocation share so more
              traffic is treated, switch to a design with more units (a geo experiment trades
              users for regions — Google's used 210 DMAs, 105 per arm), or use quasi-experimental
              methods on historical data. Deciding not to test something is a legitimate outcome
              of sizing; what is not legitimate is running a test you already know cannot
              resolve the effect and reporting its number.
          cn:
            >
              那就不做实验，这是个结果，不是失败。1 个百分点的效果每组要接近 3,830 人；
              如果这意味着两个月的流量，这个实验本来也改变不了你任何决定。
              三条正路：把分流比例调高，让更多流量进实验；换成单位更多的设计
              （地域实验拿地区换人数——Google 用的是 210 个 DMA，每组 105 个）；
              或者改用历史数据做准实验。
              「不测某个东西」是样本量测算的一个正当结论；不成立的是明知道测不出来还去跑，
              然后把它的数字报出来。
        confidence: 8
        reference:
          - docs/3-experiment-design/02-sample-size-and-power/cn.md
  - name:
      en: reading the result honestly
      cn: 怎么诚实地读结果
    qa:
      - id: fb-three-rates
        question:
          en: "Same Facebook campaign, three different lifts reported. Which is right?"
          cn: 同一批 Facebook 数据被算出了三个提升幅度，哪个对？
        answer:
          en:
            >
              The randomised one: 73%. Gordon, Zettelmeyer, Bhargava and Chapsky ran the
              experiment on 25.5 million users of a US omnichannel retailer, with 25% of the
              treatment arm actually exposed. The three conversion rates were 0.059% for control,
              0.104% for exposed and 0.020% for the unexposed part of the treatment arm. Comparing
              exposed against unexposed gives 316% — because exposure is not random, the platform
              serves ads to people already more likely to buy. Matching on age and gender brings
              it to 222%. The randomised comparison isolates what advertising did: 73%.
          cn:
            >
              随机的那个：73%。Gordon、Zettelmeyer、Bhargava 和 Chapsky 在一家美国全渠道零售商的
              2550 万用户上做了实验，实验组里 25% 真看到了广告。三个转化率分别是：
              对照组 0.059%、实验组已曝光 0.104%、实验组未曝光 0.020%。
              拿曝光的和未曝光的比，算出 316%——因为曝光不是随机的，平台会把广告投给本来就更可能买的人。
              按年龄性别精确匹配降到 222%。随机的对比才把广告本身的作用隔离出来：73%。
        confidence: 10
        reference:
          - docs/3-experiment-design/02-sample-size-and-power/cn.md
      - id: three-day-test
        question:
          en: "My test ran for three days and showed a 14.6% drop. Should I roll it back?"
          cn: 实验跑了三天，测出掉了 14.6%，要回滚吗？
        answer:
          en:
            >
              Not on that number alone. At 600 users per arm per day for three days, each arm has
              1,800 users, which at a 2% baseline resolves effects of about 1.6 percentage points —
              so a design this thin cannot distinguish a 2-point real gain from no change. The
              measured 14.6% drop sits far outside that resolution band, so its interval does not
              straddle zero and it looks "certain"; that is a statement about the precision of the
              estimate, not about the cause of it. Two further
              problems: three days crosses a weekend, and daily conversion rates are not flat.
              The real mistake in that setup was the ordering — the three days came from the boss
              wanting an answer quickly, not from the size of the effect. If the change was worth
              5 points, three days was more than enough; if it was worth 1 point, it needed 6.4
              days and the schedule should have been renegotiated.
          cn:
            >
              不能只凭那个数。每组每天 600 人跑三天，每组一共 1,800 人，在基线 2% 的情况下，
              这个样本量只能分辨大约 1.6 个百分点的效果——连 2 个百分点的真实提升都跟「没有变化」分不开。
              而测出来的 14.6% 降幅远在这个分辨范围之外，所以它的区间不跨零、看起来「很确定」；
              这说的是估计值有多精确，不是说这个偏离是谁造成的。
              还有两个问题：三天跨了一个周末，日转化率本身不平。
              那个设置里真正的错误是顺序——三天这个数来自老板想快点看到结果，
              不是来自效果有多大。如果改版真值 5 个点，三天绰绰有余；如果是 1 个点，
              每组要 3,830 人，是 6.4 天，日程得重新谈。
        confidence: 9
        reference:
          - docs/3-experiment-design/02-sample-size-and-power/cn.md
      - id: underpowered-is-a-result
        question:
          en: "Is an underpowered experiment a failed experiment?"
          cn: 样本不够的实验，算失败吗？
        answer:
          en:
            >
              No. "We could not detect it" is a legitimate, useful conclusion and often the most
              valuable thing the exercise produced. An experiment that was never sized cannot
              distinguish a 2-point gain from a 12-point loss, and reporting its point estimate as
              if it were a finding is the actual failure — it puts a number with a standard error
              on it into a report and lets someone make a budget decision on it. The distinction
              to hold onto: an underpowered experiment that says "we could not tell" has done its
              job; the same experiment that says "the effect is -14.6%" has lied.
          cn:
            >
              不算。「我们测不出来」是一个正当、有用的结论，很多时候还是这次测算最有价值的产出。
              一个从没做过样本量测算的实验，分不清 2 个百分点的提升和 12 个百分点的下滑，
              而把它的点估计当成发现报出去才是真正的失败——那等于给一个数配了个标准误放进报告，
              再让人拿它做预算决定。要分清的是：样本不够但老实说「测不出来」的实验，尽到了它的本分；
              同一个实验说「效果是 -14.6%」，那是在骗人。
        confidence: 9
        reference:
          - docs/3-experiment-design/02-sample-size-and-power/cn.md
